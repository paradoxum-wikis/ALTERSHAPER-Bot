name: Deploy the bot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
          npm ci
          npm run build
          npm prune --omit=dev

      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: "dist,node_modules,package.json,package-lock.json"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Restart ALTERSHAPER
        run: curl -X POST -u "${{ secrets.API_KEY }}:" ${{ secrets.API_URL }}
